<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar de Mercado — Widi Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --creme: #F5F0EB;
    --creme-card: #FFFFFF;
    --rose: #E8547A;
    --rose-soft: #FBE9EF;
    --tinta: #2B2622;
    --tinta-soft: #6E655E;
    --linha: #EAE2D8;
    --sombra: 0 1px 3px rgba(43,38,34,.06), 0 8px 24px rgba(43,38,34,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--creme);
    color: var(--tinta);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  header { margin-bottom: 24px; }
  .marca { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--rose); font-weight: 600; }
  h1 { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; margin: 4px 0 6px; }
  .sub { color: var(--tinta-soft); font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; color: var(--tinta-soft); }
  .meta b { color: var(--tinta); font-weight: 600; }

  .controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 24px 0 8px; position: sticky; top: 0; background: var(--creme); padding: 12px 0; z-index: 5; }
  #busca {
    flex: 1; min-width: 200px; padding: 11px 14px; border: 1px solid var(--linha);
    border-radius: 12px; font-size: 14px; font-family: inherit; background: var(--creme-card); color: var(--tinta);
  }
  #busca:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--linha); background: var(--creme-card);
    font-size: 13px; font-weight: 500; color: var(--tinta-soft); cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .chip:hover { border-color: var(--rose); color: var(--rose); }
  .chip.ativo { background: var(--rose); border-color: var(--rose); color: #fff; }
  .barra-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 18px; font-size: 13px; color: var(--tinta-soft); }
  #contador b { color: var(--tinta); }
  #toggleLidas { cursor: pointer; }

  .lista { display: grid; gap: 10px; }
  .item {
    display: flex; align-items: flex-start; gap: 12px; background: var(--creme-card);
    border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; box-shadow: var(--sombra);
    transition: transform .12s, box-shadow .12s, border-color .12s, opacity .12s;
  }
  .item:hover { border-color: var(--rose); box-shadow: 0 4px 12px rgba(232,84,122,.12); }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .titulo { font-size: 15px; font-weight: 600; color: var(--tinta); text-decoration: none; }
  .titulo:hover { color: var(--rose); }
  .rodape { display: flex; flex-wrap: wrap; gap: 8px 10px; font-size: 12.5px; color: var(--tinta-soft); align-items: center; }
  .tag { font-size: 11px; font-weight: 600; color: var(--rose); background: var(--rose-soft); padding: 2px 8px; border-radius: 999px; }
  .fonte { font-weight: 600; color: var(--tinta); }
  .dot { color: var(--linha); }

  .btn-lida {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linha);
    background: var(--creme); color: var(--tinta-soft); cursor: pointer; font-size: 14px; line-height: 1;
    display: grid; place-items: center; transition: all .12s;
  }
  .btn-lida:hover { border-color: var(--rose); background: var(--rose); color: #fff; }

  .item.lida { opacity: .5; }
  .item.lida .titulo { text-decoration: line-through; text-decoration-color: var(--tinta-soft); font-weight: 500; }

  .estado { text-align: center; padding: 60px 20px; color: var(--tinta-soft); font-size: 15px; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--linha); font-size: 12.5px; color: var(--tinta-soft); }
  footer a { color: var(--rose); text-decoration: none; }

  @media (max-width: 600px) {
    h1 { font-size: 27px; }
    .controles { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marca">Widi Care · Inteligência de Mercado</div>
    <h1>Radar de Mercado</h1>
    <p class="sub">As matérias mais recentes do nosso mercado, em ordem de publicação. Marque como lida para tirar do topo.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="controles">
    <input type="search" id="busca" placeholder="Buscar por palavra-chave, marca, tema…" />
    <div class="chips" id="chips"></div>
  </div>

  <div class="barra-status">
    <span id="contador"></span>
    <button class="chip" id="toggleLidas" style="display:none">Mostrar lidas</button>
  </div>

  <div id="conteudo"><div class="estado">Carregando matérias…</div></div>

  <footer id="rodape"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const CHAVE_LIDAS = 'widi_radar_lidas';
let DADOS = null, filtroCat = 'todas', termo = '', mostrarLidas = false;
let LIDAS = new Set();

try { LIDAS = new Set(JSON.parse(localStorage.getItem(CHAVE_LIDAS) || '[]')); } catch (e) {}
function salvarLidas() { try { localStorage.setItem(CHAVE_LIDAS, JSON.stringify([...LIDAS])); } catch (e) {} }

function tempoRel(iso) {
  if (!iso) return '';
  const d = new Date(iso), diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 0) return 'agora';
  if (diff < 3600) return 'há ' + Math.max(1, Math.round(diff / 60)) + ' min';
  if (diff < 86400) return 'há ' + Math.round(diff / 3600) + 'h';
  if (diff < 172800) return 'ontem';
  if (diff < 604800) return 'há ' + Math.round(diff / 86400) + ' dias';
  return d.toLocaleDateString('pt-BR');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// Junta as matérias das categorias do filtro atual numa lista única, ordenada por publicação.
function coletarItens() {
  const itens = [];
  for (const c of DADOS.categorias) {
    if (filtroCat !== 'todas' && c.id !== filtroCat) continue;
    for (const i of c.itens) itens.push({ ...i, cat: c.nome });
  }
  const filtrados = termo ? itens.filter((i) => (i.titulo + ' ' + i.fonte).toLowerCase().includes(termo)) : itens;
  // Ordenação por ordem de publicação (mais recente primeiro); sem data vai pro fim.
  filtrados.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  return filtrados;
}

function itemHTML(i) {
  const lida = LIDAS.has(i.url);
  const t = tempoRel(i.data);
  return `<div class="item ${lida ? 'lida' : ''}" data-url="${escAttr(i.url)}">
    <div class="item-main">
      <a class="titulo" href="${escAttr(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.titulo)}</a>
      <div class="rodape">
        <span class="tag">${esc(i.cat)}</span>
        <span class="fonte">${esc(i.fonte)}</span>
        ${t ? `<span class="dot">•</span><span>${t}</span>` : ''}
      </div>
    </div>
    <button class="btn-lida" data-action="${lida ? 'unread' : 'read'}" title="${lida ? 'Marcar como não lida' : 'Marcar como lida'}" aria-label="${lida ? 'Marcar como não lida' : 'Marcar como lida'}">${lida ? '↩' : '✓'}</button>
  </div>`;
}

function render() {
  const cont = $('#conteudo');
  const itens = coletarItens();
  const naoLidas = itens.filter((i) => !LIDAS.has(i.url));
  const lidas = itens.filter((i) => LIDAS.has(i.url));
  const visiveis = mostrarLidas ? [...naoLidas, ...lidas] : naoLidas;

  // Barra de status
  $('#contador').innerHTML = `<b>${naoLidas.length}</b> não lida${naoLidas.length === 1 ? '' : 's'}`;
  const bt = $('#toggleLidas');
  if (lidas.length || mostrarLidas) {
    bt.style.display = '';
    bt.textContent = (mostrarLidas ? 'Ocultar lidas' : 'Mostrar lidas') + (lidas.length ? ` (${lidas.length})` : '');
    bt.classList.toggle('ativo', mostrarLidas);
  } else {
    bt.style.display = 'none';
  }

  if (!visiveis.length) {
    let msg;
    if (termo) msg = `Nada encontrado para “${esc(termo)}”.`;
    else if (lidas.length && !mostrarLidas) msg = 'Tudo lido por aqui 🎉 — clique em <b>Mostrar lidas</b> para rever.';
    else msg = 'Sem matérias nesta seção.';
    cont.innerHTML = `<div class="estado">${msg}</div>`;
    return;
  }
  cont.innerHTML = `<div class="lista">${visiveis.map(itemHTML).join('')}</div>`;
}

function montarChips() {
  const chips = $('#chips');
  const botoes = [{ id: 'todas', nome: 'Todas' }, ...DADOS.categorias.map((c) => ({ id: c.id, nome: c.nome }))];
  chips.innerHTML = botoes.map((b) =>
    `<button class="chip ${b.id === 'todas' ? 'ativo' : ''}" data-id="${b.id}">${esc(b.nome)}</button>`
  ).join('');
  chips.querySelectorAll('.chip').forEach((el) => {
    el.onclick = () => {
      filtroCat = el.dataset.id;
      chips.querySelectorAll('.chip').forEach((x) => x.classList.toggle('ativo', x === el));
      render();
    };
  });
}

function montarMeta() {
  const d = new Date(DADOS.gerado_em);
  const quando = d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  $('#meta').innerHTML =
    `<span>Atualizado em <b>${quando}</b></span>` +
    `<span><b>${DADOS.total_materias}</b> matérias</span>` +
    `<span><b>${DADOS.fontes_ok}</b> fontes ativas</span>`;
  const falhas = (DADOS.fontes_falha || []).length;
  $('#rodape').innerHTML =
    `Feed gerado automaticamente todo dia às 05:00 (BRT) · ` +
    `${falhas ? `<b>${falhas}</b> fonte(s) sem retorno nesta rodada · ` : ''}` +
    `Suas matérias lidas ficam salvas neste navegador.`;
}

// Marcar/desmarcar como lida, e marcar ao abrir (comportamento de caixa de entrada).
$('#conteudo').addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-lida');
  if (btn) {
    const url = btn.closest('.item').dataset.url;
    if (btn.dataset.action === 'read') LIDAS.add(url); else LIDAS.delete(url);
    salvarLidas(); render();
    return;
  }
  const link = e.target.closest('a.titulo');
  if (link) {
    const url = link.closest('.item').dataset.url;
    if (!LIDAS.has(url)) { LIDAS.add(url); salvarLidas(); setTimeout(render, 60); }
  }
});
$('#toggleLidas').addEventListener('click', () => { mostrarLidas = !mostrarLidas; render(); });

fetch('dados/feed.json?v=' + Date.now())
  .then((r) => { if (!r.ok) throw new Error('sem feed'); return r.json(); })
  .then((d) => {
    DADOS = d;
    montarMeta(); montarChips(); render();
    $('#busca').addEventListener('input', (e) => { termo = e.target.value.toLowerCase().trim(); render(); });
  })
  .catch(() => {
    $('#conteudo').innerHTML = '<div class="estado">Ainda não há feed gerado. Rode <code>node scripts/gerar-feed.mjs</code> ou aguarde a execução automática das 5h.</div>';
  });
</script>
</body>
</html>
